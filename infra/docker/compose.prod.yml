# Produção/homologação em uma VPS (estágio 1). Segredos em infra/docker/.env.prod
# (fora do git). S3 externo (Cloudflare R2, Backblaze B2...): ver docs/DEPLOYMENT.md.
name: soscomida

x-api-env: &api-env
  env_file: .env.prod
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://soscomida:${POSTGRES_PASSWORD}@postgres:5432/soscomida
    REDIS_URL: redis://redis:6379

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  web:
    image: ${REGISTRY}/soscomida-web:${TAG}
    environment:
      API_INTERNAL_URL: http://api:4000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000
    restart: unless-stopped

  api:
    image: ${REGISTRY}/soscomida-api:${TAG}
    <<: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=4000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/api/health/ready
    # /api/metrics fica protegido por METRICS_TOKEN (defina em .env.prod).
    restart: unless-stopped

  worker:
    image: ${REGISTRY}/soscomida-api:${TAG}
    <<: *api-env
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soscomida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soscomida
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soscomida"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  letsencrypt:
