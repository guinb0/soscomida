# Infraestrutura local. Portas fora do padrão para não colidir com outros
# projetos na mesma máquina (5432/5433 já estavam em uso).
name: soscomida-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soscomida
      POSTGRES_PASSWORD: soscomida_dev
      POSTGRES_DB: soscomida
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soscomida -d soscomida"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF ligado: filas do BullMQ não podem sumir num restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 compatível para desenvolvimento. A imagem gratuita do MinIO deixou de
  # ser publicada; SeaweedFS é open-source e fala a mesma API S3. Os buckets
  # são criados pela API no boot quando NODE_ENV=development.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:9010:8333"
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  s3data:
